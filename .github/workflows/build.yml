name: Build APK
on: push

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Installer TOUTES les dépendances
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
              build-essential \
              git zip unzip \
              openjdk-17-jdk \
              python3-dev python3-pip \
              libffi-dev libssl-dev \
              autoconf libtool pkg-config \
              zlib1g-dev \
              libncurses5-dev \
              libncursesw5-dev \
              libtinfo5 \
              cmake \
              extra-cmake-modules

      - name: Configurer Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer cython

      - name: Vérifier la configuration
        run: |
          echo "=== Fichiers présents ==="
          ls -la
          echo ""
          echo "=== buildozer.spec ==="
          cat buildozer.spec
          echo ""
          echo "=== main.py (début) ==="
          head -20 main.py

      - name: Compiler l'APK
        run: |
          buildozer android debug 2>&1 | tail -100
          echo ""
          echo "=== Contenu du dossier bin ==="
          ls -la bin/ 2>&1 || echo "Dossier bin non créé"

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: AssistantLocal-APK
          path: bin/*.apk
        if: success()
