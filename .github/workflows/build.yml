name: Build APK
on: push

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential \
              git zip unzip \
              openjdk-17-jdk \
              python3-dev python3-pip \
              libffi-dev libssl-dev \
              autoconf libtool pkg-config \
              zlib1g-dev \
              cmake

      - name: Configurer Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer python-for-android
        run: |
          python -m pip install --upgrade pip setuptools wheel cython
          pip install python-for-android

      - name: Vérifier les fichiers
        run: |
          echo "=== Fichiers présents ==="
          ls -la
          echo ""
          echo "=== main.py (30 premières lignes) ==="
          head -30 main.py

      - name: Compiler l'APK
        run: |
          p4a apk \
            --name="AssistantLocal" \
            --package=org.local.assistantlocal \
            --version=1.0 \
            --bootstrap=webview \
            --requirements=python3,requests \
            --arch=arm64-v8a \
            --permission=INTERNET \
            --permission=WAKE_LOCK \
            --private=. \
            2>&1 | tail -80

      - name: Vérifier l'APK généré
        run: |
          echo "=== Fichiers APK dans le dossier courant ==="
          ls -la *.apk 2>&1 || echo "Aucun APK trouvé ici"
          echo ""
          echo "=== Recherche d'APK partout ==="
          find . -name "*.apk" 2>&1

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: AssistantLocal-APK
          path: "**/*.apk"
        if: success()
